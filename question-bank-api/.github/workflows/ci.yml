name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: question_bank
          POSTGRES_PASSWORD: question_bank_ci
          POSTGRES_DB: question_bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U question_bank -d question_bank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://question_bank:question_bank_ci@localhost:5432/postgres?schema=public
      DATABASE_URL_TEST: postgresql://question_bank:question_bank_ci@localhost:5432/question_bank_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters_long
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      FCM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - run: node node_modules/prisma/build/index.js validate
      - run: node node_modules/prisma/build/index.js migrate deploy
        env:
          DATABASE_URL: postgresql://question_bank:question_bank_ci@localhost:5432/question_bank_test?schema=public
      - run: npm run test:e2e